<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="100%" height="100%">
    <!-- Stylized Red Cursive Marg 'M' Ribbon with Glossy Gradient -->
    <path d="M 12 72 
             C 25 62, 38 48, 52 35 
             C 62 25, 72 16, 82 12 
             C 92 8, 98 12, 96 22 
             C 93 32, 82 52, 72 70 
             C 68 78, 64 84, 66 84 
             C 68 84, 76 75, 85 64 
             C 94 52, 102 38, 106 30 
             C 107 28, 109 28, 108 30 
             C 102 44, 91 62, 80 75 
             C 72 84, 64 88, 60 88 
             C 54 88, 52 84, 56 75 
             C 60 66, 68 50, 74 40 
             C 64 50, 54 62, 44, 72 
             C 36 80, 28 84, 22 84 
             C 14 84, 10 78, 12 72 Z" 
          fill="url(#margRedGrad)" 
          filter="url(#subtleShadow)" />
    
    <defs>
        <!-- Subtle shadow for depth -->
        <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
            <drop-shadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
        </filter>
        <!-- Rich Red glossy linear gradient matching the Marg ERP branding -->
        <linearGradient id="margRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4d4d" />
            <stop offset="30%" stop-color="#e60000" />
            <stop offset="70%" stop-color="#cc0000" />
            <stop offset="100%" stop-color="#990000" />
        </linearGradient>
    </defs>
</svg>
